name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Check formatting
      run: |
        files=$(gofmt -l .)
        if [ -n "$files" ]; then
          echo "Files need formatting:"
          echo "$files"
          exit 1
        fi

    - name: Vet
      run: go vet -v -tags goolm ./...

    - name: Test
      run: go test -v -tags goolm ./...
      
  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Set build metadata
      id: meta
      shell: bash
      run: |
        echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
        echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
        echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

    - name: Build
      shell: bash
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: |
        mkdir -p dist

        EXT=""
        if [ "$GOOS" = "windows" ]; then
          EXT=".exe"
        fi

        LDFLAGS="-X github.com/ilamparithi-in/matfix/internal/version.Version=${{ steps.meta.outputs.version }} \
        -X github.com/ilamparithi-in/matfix/internal/version.Commit=${{ steps.meta.outputs.commit }} \
        -X github.com/ilamparithi-in/matfix/internal/version.Date=${{ steps.meta.outputs.date }}"

        go build \
          -trimpath \
          -tags goolm \
          -ldflags "$LDFLAGS" \
          -o dist/matfix-${GOOS}-${GOARCH}${EXT} \
          ./cmd/matfix

        go build \
          -trimpath \
          -tags goolm \
          -ldflags "$LDFLAGS" \
          -o dist/matfixctl-${GOOS}-${GOARCH}${EXT} \
          ./cmd/matfixctl

    - name: Upload binaries
      uses: actions/upload-artifact@v7
      with:
        name: matfix-${{ matrix.goos }}-${{ matrix.goarch }}
        path: dist/*
        if-no-files-found: error

  docker-image:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
    
    steps:
    - uses: actions/checkout@v6

    - name: Set build metadata
      id: bmeta
      shell: bash
      run: |
        echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
        echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
        echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

    - name: Docker metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: |
          ghcr.io/${{ github.repository_owner }}/matfix
          pseudopanda/matfix
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=semver,pattern=latest

    - uses: docker/setup-qemu-action@v4

    - uses: docker/setup-buildx-action@v4

    - name: Login to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .
        build-args: |
          VERSION=${{ steps.bmeta.outputs.version }}
          COMMIT=${{ steps.bmeta.outputs.commit }}
          DATE=${{ steps.bmeta.outputs.date }}
        push: true
        platforms: linux/amd64,linux/arm64

        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

# Create GitHub Release in future